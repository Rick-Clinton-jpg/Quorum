[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-detection-engine"
version = "0.1.0"
description = "A lightweight, rule-based detection engine for prompt-injection and agent-manipulation patterns in text."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Rick-Clinton-jpg" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Rick-Clinton-jpg/Sentry"

[project.scripts]
sentry = "sentry.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentry = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
